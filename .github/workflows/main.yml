name: CI/CD Pipeline

env:
  GO_VERSION: "1.22"
  BUILD_DIR: ".build"

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  debug-build:
    name: Build Debug Binary
    strategy:
      matrix:
        include:
          - os_name: linux
            goos: linux
            goarch: amd64
          - os_name: macos
            goos: darwin
            goarch: amd64
          - os_name: windows
            goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate Build Timestamp
        run: echo "BUILD_TIME=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Build Debug Binary in Timestamped Directory
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          DIR="${{ env.BUILD_DIR }}/${{ env.BUILD_TIME }}-${{ matrix.os_name }}"
          mkdir -p "$DIR"
          go build -o "$DIR/go-tree${{ matrix.ext }}" main.go

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-${{ env.BUILD_TIME }}
          path: ${{ env.BUILD_DIR }}/${{ env.BUILD_TIME }}-${{ matrix.os_name }}
          retention-days: 14

  release:
    name: Release
    needs: [lint, debug-build]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os_name: linux
            goos: linux
            goarch: amd64
          - os_name: macos
            goos: darwin
            goarch: amd64
          - os_name: windows
            goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Tests
        run: go test -v ./...

      - name: Build Release Binary in Tagged Directory
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          DIR="${{ env.BUILD_DIR }}/${{ github.ref_name }}-${{ matrix.os_name }}"
          mkdir -p "$DIR"
          go build -o "$DIR/go-tree${{ matrix.ext }}" main.go

      - name: Create Archives for Release
        run: |
          cd build
          tar -czf release-${{ github.ref_name }}-${{ matrix.os_name }}.tar.gz release-${{ github.ref_name }}-${{ matrix.os_name }}

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: build/release-*.tar.gz
          generate_release_notes: true
